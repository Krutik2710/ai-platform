apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-platform-api
  namespace: ai-platform
spec:
  replicas: 1

  selector:
    matchLabels:
      app: ai-platform-api

  template:
    metadata:
      labels:
        app: ai-platform-api

    spec:
      containers:
        - name: api
          image: ghcr.io/krutik2710/ai-platform-api
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000
          
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: ai_platform
            - name: POSTGRES_USER
              value: ai_platform
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
