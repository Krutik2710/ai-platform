apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-platform-api
  namespace: ai-platform
spec:
  replicas: 1

  selector:
    matchLabels:
      app: ai-platform-api

  template:
    metadata:
      labels:
        app: ai-platform-api

    spec:
      containers:
        - name: api
          image: ghcr.io/krutik2710/ai-platform-api:sha-c92c326
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
