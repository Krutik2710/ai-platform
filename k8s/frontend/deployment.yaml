apiVersion: apps/v1
kind: Deployment

metadata:
  name: ai-platform-frontend
  namespace: ai-platform

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ai-platform-frontend

  template:
    metadata:
      labels:
        app: ai-platform-frontend

    spec:
      containers:
        - name: frontend

          image: ghcr.io/krutik2710/ai-platform-frontend

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"

            limits:
              cpu: "250m"
              memory: "256Mi"
