name: Build and Push Images

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "tests/**"
      - ".github/workflows/build-and-push.yml"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: ${{ github.repository_owner }}/ai-platform-api
  FRONTEND_IMAGE_NAME: ${{ github.repository_owner }}/ai-platform-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # Backend tests
      # ------------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run tests
        run: pytest


      # ------------------------------------------------------------
      # Login to GHCR
      # ------------------------------------------------------------

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ------------------------------------------------------------
      # API image metadata
      # ------------------------------------------------------------

      - name: Extract API image metadata
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}
          tags: |
            type=sha,format=short


      # ------------------------------------------------------------
      # Build and push API
      # ------------------------------------------------------------

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}


      # ------------------------------------------------------------
      # Frontend image metadata
      # ------------------------------------------------------------

      - name: Extract frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=sha,format=short


      # ------------------------------------------------------------
      # Build and push frontend
      # ------------------------------------------------------------

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}


      # ------------------------------------------------------------
      # Update GitOps image tags
      # ------------------------------------------------------------

      - name: Update GitOps image tags
        run: |
          TAG="sha-${GITHUB_SHA::7}"

          sed -i "s/newTag: .*/newTag: ${TAG}/" k8s/backend/kustomization.yaml

          sed -i "s/newTag: .*/newTag: ${TAG}/" k8s/frontend/kustomization.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            k8s/backend/kustomization.yaml \
            k8s/frontend/kustomization.yaml

          if git diff --cached --quiet; then
            echo "Image tags already up to date"
            exit 0
          fi

          git commit -m "chore: update application image tags to ${TAG}"

          git push